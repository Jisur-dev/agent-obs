[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "agent-obs"
dynamic = ["version"]

description = "A lightweight toolkit for observability, prompt/agent configuration versioning, and reliability middleware for AI agents."
readme = "README.md"
license = { text = "Apache-2.0" }

authors = [
    { name = "Safouene Ziadi", email = "ziadisafouene@gmail.com" },
]

requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]

keywords = [
    "guardrails",
    "ai-guardrails",
    "ai-safety",
    "llm",
    "llm-safety",
    "agents",
    "ai-agents",
    "prompt-injection",
    "pii",
    "data-privacy",
    "nlp",
    "arabic",
    "arabic-nlp",
    "ai-governance",
    "observability",
    "multi-agent",
    "prompt-versioning",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/Jisurr/agent-obs"
Repository = "https://github.com/Jisurr/agent-obs"
Issues = "https://github.com/Jisurr/agent-obs/issues"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "twine>=6.2.0",
    "uv-dynamic-versioning>=0.14.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_obs"]
